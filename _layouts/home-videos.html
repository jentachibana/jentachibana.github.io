---
layout: base
---

<div class="home-videos">
  <a class="home-videos-back" href="/">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
  <h1 class="home-videos-title">imovie muck</h1>

  <div class="video-grid">
    {% for video in site.data.videos %}
    <div class="video-card">
      <div class="video-embed">
        <iframe
          src="https://www.youtube-nocookie.com/embed/{{ video.youtube_id }}?autoplay=1&mute=1&controls=0&modestbranding=1&showinfo=0&rel=0&loop=1&playlist={{ video.youtube_id }}&iv_load_policy=3&disablekb=1&fs=0&enablejsapi=1&origin={{ site.url }}"
          title="{{ video.title }}"
          frameborder="0"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
      {% if video.title != "untitled" %}
      <span class="video-title">{{ video.title }}</span>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</div>

<script>
var grid = document.querySelector('.video-grid');
var cards = Array.from(grid.children);
for (var i = cards.length - 1; i > 0; i--) {
  var j = Math.floor(Math.random() * (i + 1));
  grid.appendChild(cards[j]);
  cards.splice(j, 1);
}

var tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

function onYouTubeIframeAPIReady() {
  var iframes = document.querySelectorAll('.video-embed iframe');
  iframes.forEach(function(iframe) {
    new YT.Player(iframe, {
      events: {
        onReady: function(event) {
          var duration = event.target.getDuration();
          if (duration > 0) {
            event.target.seekTo(Math.floor(Math.random() * duration), true);
          }
          event.target.playVideo();
        },
        onStateChange: function(event) {
          if (event.data === YT.PlayerState.ENDED) {
            event.target.seekTo(0, true);
            event.target.playVideo();
          }
        }
      }
    });
  });
}
</script>
